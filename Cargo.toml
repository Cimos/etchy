[workspace]
resolver = "2"
members = [
    "crates/etchy-core",
    "crates/etchy-cli",
    "crates/etchy-gui",
    "crates/etchy-pdf",
]
# The cargo-fuzz harness (#85) is its own workspace (nightly + sanitizer only).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Cimos/etchy"
authors = ["Cimos"]

# Shared dependency versions (verified choices live in docs/DEVELOPER_GUIDE.md).
# Real deps land per-crate as each module is built in Milestone 1+.
[workspace.dependencies]
# engine
i_overlay = "7"
gerber_parser = "0.5"
gerber-types = "0.7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cli
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# gui — default-features=false drops the wgpu backend + naga (#86); the gui crate
# re-adds glow + the features it needs. Must live here: a member crate can't
# override default-features on a workspace-inherited dep.
eframe = { version = "0.34", default-features = false }
egui = "0.34"
# tests
proptest = "1"

# Release profile (#87). These flags cut size AND help speed, so they're safe
# workspace-wide: fat LTO + a single codegen unit let the optimizer inline across
# crates, and strip removes symbols. We deliberately leave `opt-level` at the
# release default (3): opt-level="z" would shrink the binary but slow the
# large-board diff (Phase 3 perf) — the wasm *bundle* gets its size win from the
# glow swap (#86) plus a post-build binaryen `wasm-opt -Oz` run in CI/deploy (#99;
# trunk's own wasm-opt is disabled in index.html because its bundled binaryen
# rejects Rust's bulk-memory output), which don't touch the native engine's speed.
# `panic="abort"` is intentionally NOT set: Phase 1 #85
# wants a catch_unwind boundary around the third-party parser, which abort would
# defeat. Revisit both once #85 lands.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

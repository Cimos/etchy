[workspace]
resolver = "2"
members = [
    "crates/etchy-core",
    "crates/etchy-cli",
    "crates/etchy-gui",
    "crates/etchy-pdf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Cimos/etchy"
authors = ["Simon Maddison"]

# Shared dependency versions (verified choices live in docs/DEVELOPER_GUIDE.md).
# Real deps land per-crate as each module is built in Milestone 1+.
[workspace.dependencies]
# engine
i_overlay = "7"
gerber_parser = "0.5"
gerber-types = "0.7"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cli
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# gui
eframe = "0.34"
egui = "0.34"
# tests
proptest = "1"

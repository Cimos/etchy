# Example: gate a PR on a PCB diff with etchy. Copy into a consuming repo's
# .github/workflows/. Least-privilege; pin third-party actions to a commit SHA.
name: PCB diff
on:
  pull_request:
    paths: ["fab/**"] # adjust to where the board's Gerber/Excellon output lives

permissions:
  contents: read
  pull-requests: write # only needed when `comment: true`

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      # SHA-pin in real use (see the audit-third-party-CI rule): actions/checkout@<sha> # v4
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Cimos/etchy@main # the composite action at the repo root (pin to a tag/SHA on release)
        with:
          old: fab/rev-a
          new: fab/rev-b
          fail-on-diff: true
          comment: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# cargo-fuzz harness for the Gerber, Excellon and pick-and-place front-ends
# (#85, #308). Its own workspace so the stable `cargo build --workspace` never
# tries to build it — libfuzzer needs a nightly toolchain + the sanitizer
# runtime. Run with:
#   cargo +nightly fuzz run resolve_layer
#   cargo +nightly fuzz run resolve_excellon
#   cargo +nightly fuzz run resolve_placement
[package]
name = "etchy-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
etchy-core = { path = "../crates/etchy-core" }

[[bin]]
name = "resolve_layer"
path = "fuzz_targets/resolve_layer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve_excellon"
path = "fuzz_targets/resolve_excellon.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve_placement"
path = "fuzz_targets/resolve_placement.rs"
test = false
doc = false
bench = false

# Detach from the parent workspace (cargo-fuzz convention).
[workspace]

name: Release

# Hand-rolled release: on a version tag, build the `etchy` CLI per-OS on native
# runners (musl for a static Linux binary), then attach the archives + checksums
# to the GitHub Release. Deliberately lean — only the first-party actions ci.yml
# already uses, plus the built-in `gh` CLI for the upload (no extra third-party
# action to audit/pin). The GUI is not shipped here; only the headless CLI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release + upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, ext: zip }
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable) + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl tools (static Linux build)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the etchy CLI
        # --features pdf so release binaries carry the schematic-PDF diff (CLI-6),
        # as the README/REQUIREMENTS promise. hayro is pure-Rust and builds static
        # on musl; verified locally on host, musl-static, and wasm32.
        run: cargo build --release -p etchy-cli --features pdf --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        env:
          # Route the tag (externally-influenced) through env, never interpolated
          # straight into the shell. matrix.* are our own trusted literals.
          REF_NAME: ${{ github.ref_name }}
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dir="etchy-${REF_NAME}-${NAME}"
          mkdir "$dir"
          cp "target/${TARGET}/release/etchy" "$dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/" 2>/dev/null || true
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dir="etchy-${REF_NAME}-${NAME}"
          mkdir "$dir"
          cp "target/${TARGET}/release/etchy.exe" "$dir/"
          cp README.md "$dir/" 2>/dev/null || true
          7z a "$dir.zip" "$dir"
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # A tag with a '-' (e.g. v0.1.0-rc1, v0.1.0-beta) is a pre-release.
            args=(--title "etchy $TAG" --generate-notes)
            case "$TAG" in *-*) args+=(--prerelease) ;; esac
            gh release create "$TAG" dist/* "${args[@]}"
          fi

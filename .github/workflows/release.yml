name: Release

# Hand-rolled release: on a version tag, build the `etchy` CLI per-OS on native
# runners (musl for a static Linux binary), then attach the archives + checksums
# to the GitHub Release. Deliberately lean — only the first-party actions ci.yml
# already uses, plus the built-in `gh` CLI for the upload (no extra third-party
# action to audit/pin). The GUI is not shipped here; only the headless CLI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read # least privilege by default; the release job below opts up to write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: linux-x86_64, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-aarch64, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, ext: zip }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust (stable) + target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: musl tools (static Linux build)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build the etchy CLI
        # --features pdf so release binaries carry the schematic-PDF diff (CLI-6),
        # as the README/REQUIREMENTS promise. hayro is pure-Rust and builds static
        # on musl; verified locally on host, musl-static, and wasm32.
        run: cargo build --release -p etchy-cli --features pdf --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        env:
          # Route the tag (externally-influenced) through env, never interpolated
          # straight into the shell. matrix.* are our own trusted literals.
          REF_NAME: ${{ github.ref_name }}
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dir="etchy-${REF_NAME}-${NAME}"
          mkdir "$dir"
          cp "target/${TARGET}/release/etchy" "$dir/"
          # No `|| true` here: an archive that quietly ships without its licences
          # is exactly the kind of silent miss this project refuses elsewhere.
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dir="etchy-${REF_NAME}-${NAME}"
          mkdir "$dir"
          cp "target/${TARGET}/release/etchy.exe" "$dir/"
          # Carry the licences here too — etchy is dual-licensed and the unix
          # archives include both, so the Windows archive must not be the odd
          # one out. Fail loud rather than shipping an archive without them.
          cp README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          7z a "$dir.zip" "$dir"
          echo "ASSET=$dir.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    # Only this job creates the Release and uploads assets, so scope the write
    # token here — the build matrix above stays read-only (least privilege, #254).
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            # A tag with a '-' (e.g. v0.1.0-rc1, v0.1.0-beta) is a pre-release.
            args=(--title "etchy $TAG" --generate-notes)
            case "$TAG" in *-*) args+=(--prerelease) ;; esac
            gh release create "$TAG" dist/* "${args[@]}"
          fi

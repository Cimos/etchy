name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build
        run: cargo build --workspace --all-targets

      # Populate the golden corpus so the deep `committed_corpus_*` test runs
      # (revA/revB are gitignored — regenerated on demand). Best-effort: where
      # Python is absent the test skips gracefully and the self-contained
      # `synthetic_*` golden tests still provide full coverage.
      - name: Generate golden corpus (best-effort)
        run: python corpus/tools/gen_synth_board.py --out corpus/synthetic --copper-layers 16 --grid 24
        continue-on-error: true

      - name: Test
        run: cargo test --workspace

      # Gating on fmt/clippy is enabled once a local toolchain has run `cargo fmt`
      # and the real dependencies land (Milestone 1). Until then they're
      # informational so the Phase-0 scaffold isn't blocked on un-runnable lints.
      - name: rustfmt (informational)
        run: cargo fmt --all --check
        continue-on-error: true

      - name: clippy (informational)
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  wasm:
    name: web build (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable) + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Prebuilt trunk binary, pinned — avoids the slow build-from-source and
      # any extra third-party action. Bump deliberately alongside the toolchain.
      - name: Install trunk (prebuilt, pinned)
        run: |
          set -euo pipefail
          ver=v0.21.14
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${ver}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"
          trunk --version

      # Builds the browser viewer, which embeds the committed demo board via
      # include_dir! — the gate that keeps the public demo board buildable.
      - name: Build web viewer (embeds the committed demo board)
        working-directory: crates/etchy-gui
        run: trunk build --release --filehash false

      - name: Verify bundle produced
        run: |
          test -f crates/etchy-gui/dist/etchy-gui_bg.wasm
          test -f crates/etchy-gui/dist/etchy-gui.js

  deny:
    name: cargo-deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Install from crates.io (no extra third-party action to audit). Slower than
      # a prebuilt binary; swap for a pinned prebuilt (like trunk above) if it drags.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # Enforces the permissive-only license policy + RUSTSEC advisories + bans
      # (deny.toml). A real advisory or a non-allow-listed license fails the job.
      - name: cargo deny check
        run: cargo deny check advisories bans licenses

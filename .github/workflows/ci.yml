name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref (a rapid rebase/force-push no longer
# leaves several full matrices grinding in parallel) — a big Actions-minute saver.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs on every push + PR (Linux, 1x minutes). fmt + clippy gate here.
  test:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Fail loud if a private board slipped into the tracked demo fab pack.
      - name: Guard demo assets (public board only)
        run: bash scripts/check-demo-assets.sh

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy

      # Without this every job recompiles the whole dependency tree from
      # scratch, which is where most of the Actions minutes go. Keyed on the
      # lockfile so a dependency bump invalidates it; the restore-key prefix
      # still gives a warm start when only our own code changed.
      - name: Cache cargo + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --workspace --all-targets

      # TRUST gate: populate the golden corpus (revA/revB are gitignored,
      # regenerated on demand) so the deep cross-validation test
      # (committed_corpus_matches_ground_truth) runs against the ground truth
      # instead of skipping. Must fail loud — a bare `python` is absent on the
      # runners, so use python3 and let a failure fail the job (no
      # continue-on-error). The guard below then refuses to proceed if the corpus
      # came out empty, so the cross-check can never be silently skipped in CI.
      - name: Generate golden corpus
        run: python3 corpus/tools/gen_synth_board.py --out corpus/synthetic --copper-layers 16 --grid 24

      - name: Verify golden corpus populated (no silent skip)
        run: |
          set -euo pipefail
          test -f corpus/synthetic/ground_truth.json
          test -n "$(ls -A corpus/synthetic/revA 2>/dev/null)"
          test -n "$(ls -A corpus/synthetic/revB 2>/dev/null)"

      # ETCHY_REQUIRE_CORPUS=1 makes committed_corpus_matches_ground_truth fail
      # (rather than skip) if the corpus is missing, so the deep test can never
      # quietly stop running here.
      - name: Test
        run: cargo test --locked --workspace
        env:
          ETCHY_REQUIRE_CORPUS: "1"

      # The PDF path is behind an off-by-default feature, so `--workspace` alone
      # never compiles the etchy-pdf engine tests or the PDF CLI contract tests
      # (the exit-1-not-2 assertion for a resized sheet lives there). Run them
      # explicitly or they silently do not run at all.
      - name: Test (pdf feature)
        run: |
          set -euo pipefail
          cargo test --locked --workspace --features pdf
          cargo test --locked -p etchy-cli --features pdf

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (warnings are errors)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Windows (2x) and macOS (10x) minutes are expensive, so the cross-platform
  # build+test only runs on pushes to main — not on every PR iteration. PRs get
  # the full Linux gate above; cross-OS regressions surface at merge time.
  test-cross:
    name: build + test (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # Worth the most here: Windows bills at 2x and macOS at 10x, so a warm
      # target/ on these two legs saves more minutes than anywhere else.
      - name: Cache cargo + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --workspace --all-targets

      # The golden-corpus cross-validation runs for real in the ubuntu `test` job
      # (which generates the corpus with python3). This cross-OS leg only needs to
      # confirm the workspace builds and tests pass on Windows/macOS, so it does not
      # regenerate the corpus here — that step relied on python3, which the
      # GitHub-hosted Windows runner doesn't provide, and on a bash-only guard.
      - name: Test
        run: cargo test --locked --workspace

  # The Python checks: README/site number agreement and the deploy tests (demo
  # server, feedback widget, feedback collector). Standard library only, no
  # Rust build, so this job takes seconds. Without it they only ran by hand (#435).
  python:
    name: python checks (landing + deploy tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Python 3
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Landing numbers match README
        run: python3 scripts/check-landing.py

      - name: Deploy + landing unit tests
        run: >-
          python3 -m unittest
          deploy/demo/test_etchy_server.py
          deploy/demo/test_feedback_widget.py
          deploy/test_collect_feedback.py
          scripts/test_check_landing.py

  # Runs the GitHub Action (action.yml) for real on the bundled demo pair (#454):
  # the install path, the report files, the artifact upload and the sticky PR
  # comment. The `release` leg downloads the latest released binary (that's
  # what `uses: ./` resolves to, since a local action has no action_ref); the
  # `source` leg builds this PR's CLI, so a CLI change that breaks the Action's
  # flags fails here before a release ships it. Only the release leg comments.
  #
  # Fork PRs get a read-only token whatever this block asks for; the Action
  # then warns and skips the comment, and the comment check below is skipped.
  # Plain pull_request only, never pull_request_target.
  action:
    name: action smoke test (${{ matrix.install }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the sticky comment
    strategy:
      fail-fast: false
      matrix:
        include:
          - install: release
            build-from-source: "false"
            comment: "true"
          - install: source
            build-from-source: "true"
            comment: "false"
    env:
      OLD: crates/etchy-gui/assets/demo/old
      NEW: crates/etchy-gui/assets/demo/new
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust (stable)
        if: matrix.install == 'source'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # Own key: this is a --release build of etchy-cli only, so the debug
      # target/ from the `test` job doesn't help it.
      - name: Cache cargo + target (release CLI)
        if: matrix.install == 'source'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-action-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-action-

      # The demo pair differs, so report-only: a diff must not turn this red.
      - name: Run the Action (demo pair, report only)
        id: etchy
        uses: ./
        with:
          old: ${{ env.OLD }}
          new: ${{ env.NEW }}
          fail-on-diff: "false"
          comment: ${{ matrix.comment }}
          build-from-source: ${{ matrix.build-from-source }}

      - name: Check outputs, report files and artifact
        env:
          CHANGED: ${{ steps.etchy.outputs.changed }}
          REPORT_DIR: ${{ steps.etchy.outputs.report-dir }}
          ARTIFACT_URL: ${{ steps.etchy.outputs.artifact-url }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [ "$CHANGED" = "true" ] || fail "changed=$CHANGED, expected true for the demo pair"
          [ -n "$REPORT_DIR" ] || fail "report-dir output is empty"
          for f in summary.md report.html comment.md; do
            [ -s "$REPORT_DIR/$f" ] || fail "$REPORT_DIR/$f is missing or empty"
          done
          n="$(find "$REPORT_DIR/svg" -maxdepth 1 -name '*.svg' -type f | wc -l)"
          [ "$n" -gt 0 ] || fail "no per-layer SVGs in $REPORT_DIR/svg"
          [[ "$ARTIFACT_URL" == https://* ]] || fail "artifact-url is '$ARTIFACT_URL', expected the uploaded artifact's link"
          echo "changed=$CHANGED, $n layer SVGs, artifact $ARTIFACT_URL"

      # Same-repo PRs only: a fork's token can't comment, by design.
      - name: Check the sticky PR comment
        if: >-
          matrix.comment == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT_DIR: ${{ steps.etchy.outputs.report-dir }}
        run: |
          set -euo pipefail
          # The report folder is etchy-report-<key>; the comment marker uses the same key.
          key="$(basename "$REPORT_DIR")"
          key="${key#etchy-report-}"
          marker="<!-- etchy-diff:${key} -->"
          n="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | startswith(\"$marker\"))] | length" | awk '{s+=$1} END {print s+0}')"
          [ "$n" -eq 1 ] || { echo "::error::expected exactly 1 sticky comment with $marker, found $n"; exit 1; }
          echo "sticky comment present ($marker)"

      # The gate: with fail-on-diff (the default) the same pair must fail the step.
      - name: Run the Action (demo pair, gate)
        id: gate
        continue-on-error: true
        uses: ./
        with:
          old: ${{ env.OLD }}
          new: ${{ env.NEW }}
          upload-report: "false"
          build-from-source: ${{ matrix.build-from-source }}

      - name: Run the Action (no change)
        id: same
        uses: ./
        with:
          old: ${{ env.OLD }}
          new: ${{ env.OLD }}
          build-from-source: ${{ matrix.build-from-source }}

      - name: Check gate and no-change results
        env:
          GATE: ${{ steps.gate.outcome }}
          GATE_CHANGED: ${{ steps.gate.outputs.changed }}
          SAME_CHANGED: ${{ steps.same.outputs.changed }}
        run: |
          set -euo pipefail
          [ "$GATE" = "failure" ] || { echo "::error::fail-on-diff step outcome is $GATE, expected failure"; exit 1; }
          [ "$GATE_CHANGED" = "true" ] || { echo "::error::gate changed=$GATE_CHANGED, expected true"; exit 1; }
          [ "$SAME_CHANGED" = "false" ] || { echo "::error::old-vs-old changed=$SAME_CHANGED, expected false"; exit 1; }

  wasm:
    name: web build (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust (stable) + wasm target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown

      # Separate cache key from the native jobs: this job builds for
      # wasm32-unknown-unknown, so its target/ contents don't overlap.
      - name: Cache cargo + target (wasm)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      # Prebuilt trunk binary, pinned — avoids the slow build-from-source and
      # any extra third-party action. Bump deliberately alongside the toolchain.
      - name: Install trunk (prebuilt, pinned + checksum-verified)
        run: |
          set -euo pipefail
          ver=v0.21.14
          sha256=f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${ver}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            -o trunk.tar.gz
          echo "${sha256}  trunk.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME/.cargo/bin" -f trunk.tar.gz
          rm -f trunk.tar.gz
          trunk --version

      # Prebuilt binaryen, pinned. trunk's own wasm-opt is disabled in index.html
      # (its bundled binaryen fails on Rust's bulk-memory output, #99); we run
      # wasm-opt ourselves below with all features enabled.
      - name: Install binaryen (wasm-opt, prebuilt, pinned + checksum-verified)
        run: |
          set -euo pipefail
          ver=version_123
          sha256=e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${ver}/binaryen-${ver}-x86_64-linux.tar.gz" \
            -o binaryen.tar.gz
          echo "${sha256}  binaryen.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME" -f binaryen.tar.gz
          rm -f binaryen.tar.gz
          echo "$HOME/binaryen-${ver}/bin" >> "$GITHUB_PATH"

      # Builds the browser viewer, which embeds the committed demo board via
      # include_dir! — the gate that keeps the public demo board buildable.
      - name: Build web viewer (embeds the committed demo board)
        working-directory: crates/etchy-gui
        run: trunk build --release --filehash false --locked

      # Size-optimize the bundle the way deploy does, and prove it validates. This
      # is the real #99 gate: a regression that reintroduces the bulk-memory issue
      # fails here instead of silently shipping a broken/unoptimized bundle.
      - name: Optimize wasm bundle (wasm-opt -Oz)
        working-directory: crates/etchy-gui
        run: |
          set -euo pipefail
          before=$(stat -c%s dist/etchy-gui_bg.wasm)
          wasm-opt -all -Oz --strip-debug dist/etchy-gui_bg.wasm -o dist/etchy-gui_bg.wasm
          after=$(stat -c%s dist/etchy-gui_bg.wasm)
          echo "wasm bundle: $before -> $after bytes"

      - name: Verify bundle produced
        run: |
          test -f crates/etchy-gui/dist/etchy-gui_bg.wasm
          test -f crates/etchy-gui/dist/etchy-gui.js

  # Every other job builds on floating `stable`, so without this nothing proves
  # the declared `rust-version`s still hold (#350). The toolchain is read from the
  # manifest itself so the check can't drift from what we promise. `cargo +<ver>`
  # is explicit because rust-toolchain.toml would otherwise force `stable`.
  msrv:
    name: MSRV check (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core + cli + kicad
            manifests: Cargo.toml
            args: -p etchy-core -p etchy-cli -p etchy-kicad
          - group: gui + pdf
            manifests: crates/etchy-gui/Cargo.toml crates/etchy-pdf/Cargo.toml
            args: -p etchy-gui -p etchy-pdf -p etchy-cli --features etchy-gui/pdf,etchy-pdf/pdf,etchy-cli/pdf
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Read declared rust-version
        id: msrv
        run: |
          set -euo pipefail
          ver=
          for m in ${{ matrix.manifests }}; do
            v=$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' "$m")
            test -n "$v" || { echo "no rust-version in $m" >&2; exit 1; }
            if [ -n "$ver" ] && [ "$v" != "$ver" ]; then
              echo "rust-version mismatch in this group: $m=$v vs $ver" >&2; exit 1
            fi
            ver=$v
          done
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "MSRV for ${{ matrix.group }}: $ver"

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-

      - name: cargo check at MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --locked ${{ matrix.args }}

  deny:
    name: cargo-deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      # Prebuilt binary, pinned + checksum-verified — same pattern as trunk in the
      # wasm job. Building cargo-deny from crates.io took most of this job's time;
      # the download is seconds. The sha256 is the one published alongside the
      # release asset. Bump both together, deliberately.
      - name: Install cargo-deny (prebuilt, pinned + checksum-verified)
        run: |
          set -euo pipefail
          ver=0.20.2
          target=x86_64-unknown-linux-musl
          sha256=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${ver}/cargo-deny-${ver}-${target}.tar.gz" \
            -o cargo-deny.tar.gz
          echo "${sha256}  cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf cargo-deny.tar.gz
          install -m 0755 "cargo-deny-${ver}-${target}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          rm -rf cargo-deny.tar.gz "cargo-deny-${ver}-${target}"
          cargo-deny --version

      # Enforces the permissive-only license policy + RUSTSEC advisories + bans
      # (deny.toml). A real advisory or a non-allow-listed license fails the job.
      - name: cargo deny check
        run: cargo deny check advisories bans licenses

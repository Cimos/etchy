[package]
name = "etchy-cli"
description = "etchy command-line interface — the primary surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "etchy"
path = "src/main.rs"

[features]
# Off by default: the schematic-PDF pixel-diff path (etchy-pdf/hayro) stays out
# of the default build so the geometric-diff binary keeps its lean dep tree and
# low MSRV. Turn on with `--features pdf` (release binaries ship it on).
default = []
pdf = ["dep:etchy-pdf", "etchy-pdf/pdf"]

[dependencies]
etchy-core = { path = "../etchy-core" }
etchy-pdf = { path = "../etchy-pdf", optional = true }
clap.workspace = true
anyhow.workspace = true
# serde/serde_json are always on: etchy-core already pulls them in, and the
# geometry JSON output attaches the CI-gate verdict (so the message and exit
# code can never disagree — #258).
serde = { workspace = true }
serde_json = { workspace = true }

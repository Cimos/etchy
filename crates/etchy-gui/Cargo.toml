[package]
name = "etchy-gui"
description = "etchy native desktop viewer (egui) — secondary surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "etchy-gui"
path = "src/main.rs"

[dependencies]
etchy-core = { path = "../etchy-core" }
# "persistence" pulls eframe's storage backends so user settings (#52) survive a
# restart on BOTH surfaces: a RON config file on native, localStorage on web. No
# new external crate — serde/ron/home are already in the workspace lock.
eframe = { workspace = true, features = ["persistence"] }
egui.workspace = true
# GPU base-copper transform (#9/#10, viewer perf): an egui_wgpu CallbackTrait uploads
# the visible base geometry once and a WGSL vertex shader applies the camera each
# frame, so dense multi-layer pan/zoom isn't bound by per-frame CPU transform. wgpu is
# already eframe's renderer here; wgpu types come via egui_wgpu's re-export.
egui-wgpu = "0.34"
bytemuck = { version = "1", features = ["derive"] }
anyhow.workspace = true
# Settings (#52) are serialized via eframe's storage; serde derive lives here.
serde.workspace = true

[dev-dependencies]
# Round-trip test for the persisted Settings struct (#52).
serde_json.workspace = true

# Web (WASM) build only — the browser entry point + canvas wiring + the bundled
# demo board (embedded at compile time; the board itself is gitignored).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement"] }
js-sys = "0.3"
include_dir = "0.7"

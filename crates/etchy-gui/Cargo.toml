[package]
name = "etchy-gui"
description = "etchy native desktop viewer (egui) — secondary surface."
version.workspace = true
edition.workspace = true
# The default `pdf` feature pulls etchy-pdf/hayro, which needs 1.85 (see that
# crate's manifest). A --no-default-features build still compiles on the
# workspace MSRV, but the shipped default is pdf-on so the floor is declared here.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "etchy-gui"
path = "src/main.rs"

[features]
# Schematic-PDF diff view (#63) — ON by default: the release ships PDF support in
# BOTH the native and web viewer (locked decision, docs/design/pdf-diff-plan.md
# §7). hayro is pure Rust and compiles on wasm32, so the web build carries it too.
# Build lean without it: --no-default-features.
default = ["pdf"]
pdf = ["dep:etchy-pdf", "etchy-pdf/pdf"]
# GPU world->screen transform for the base mesh (#106). Off by default; when on,
# it is still gated behind a runtime toggle with the CPU path as the fallback, so
# it ships safe and is trivial to pull. Build with: --features gpu-transform.
gpu-transform = []

[dependencies]
etchy-core = { path = "../etchy-core" }
# Schematic-PDF rasterize + pixel diff (#63); optional but in the default set
# (feature `pdf` above) so both shipped surfaces can open PDF pairs.
etchy-pdf = { path = "../etchy-pdf", optional = true }
# default-features=false drops eframe's wgpu backend + naga (~half the wasm
# bundle, #86); we render through glow (WebGL2 on web, OpenGL on native), which
# also makes the future GPU base-transform path verifiable headless. We re-add
# only the defaults we use: glow (renderer), default_fonts (text), and the linux
# windowing backends (wayland/x11). "persistence" pulls eframe's storage backends
# so user settings (#52) survive a restart on BOTH surfaces: a RON config file on
# native, localStorage on web. No new external crate.
eframe = { workspace = true, features = [
    "glow",
    "default_fonts",
    "persistence",
    "wayland",
    "x11",
] }
egui.workspace = true
anyhow.workspace = true
# Settings (#52) are serialized via eframe's storage; serde derive lives here.
serde.workspace = true
# Zip fab-pack reader (#120). default-features=false + deflate keeps it lean and
# wasm-friendly (in-memory Cursor, no filesystem). MIT.
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
# File/folder dialog + browser file picker (#120). rfd has first-class wasm
# support, so it's all-targets: gtk3 backend on Linux, the HTML file API on web.
# `file-handle-inner` exposes the underlying `web_sys::File` so the web picker can
# read `File.size` and reject an oversized upload before pulling it into wasm
# memory (#247). MIT — cargo-deny clean.
rfd = { version = "0.17.2", features = ["file-handle-inner"] }
# Decode the embedded brand-icon PNG for the top-bar mark (#191). Already in the
# tree via eframe/arboard, so this adds no new crate; default-features off + png
# keeps it lean, and the pure-Rust png decoder works on wasm too.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Embeds the app icon into etchy-gui.exe so Windows shows it on the taskbar,
# Start menu and in Explorer (#390). MIT.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
# Round-trip test for the persisted Settings struct (#52).
serde_json.workspace = true

# Web (WASM) build only — the browser entry point + canvas wiring + the bundled
# demo board (embedded at compile time; the board itself is gitignored).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
# Element/Blob/Url/HtmlAnchorElement: the export download path (#60) builds a Blob
# and clicks a synthetic <a download>.
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "HtmlCanvasElement",
    "Element",
    "Blob",
    "File",
    "Url",
    "HtmlAnchorElement",
] }
js-sys = "0.3"
include_dir = "0.7"

# Desktop installers (.msi, .dmg, .deb, .AppImage), built by cargo-packager in
# release.yml. Run from this crate directory: `cargo packager --release -f deb`.
[package.metadata.packager]
product-name = "etchy"
identifier = "io.github.cimos.etchy"
publisher = "Cimos"
homepage = "https://cimos.github.io/etchy/"
description = "Visual and geometric diff viewer for PCB Gerber, drill and PDF revisions"
category = "DeveloperTool"
license-file = "../../LICENSE-MIT"
icons = ["../../assets/brand/png/etchy-app-icon-512.png"]
out-dir = "../../target/packager"
# The installers carry the `etchy` command-line tool too, on PATH: /usr/bin in
# the .deb, the install folder in the .msi, and a brew `binary` link on macOS.
before-packaging-command = "cargo build --release -p etchy-gui -p etchy-cli --features etchy-cli/pdf"
binaries = [{ path = "etchy-gui", main = true }, { path = "etchy" }]

[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libgl1", "libegl1"]

[package.metadata.packager.wix]
component-refs = ["EtchyPath"]
fragments = ["""<?xml version="1.0" encoding="utf-8"?>
<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
  <Fragment>
    <DirectoryRef Id="INSTALLDIR">
      <Component Id="EtchyPath" Guid="5d0b1a52-8a4e-5f43-9a43-2c1f0f6e7c11" KeyPath="yes">
        <Environment Id="EtchyPathEnv" Name="PATH" Value="[INSTALLDIR]" Part="last" Action="set" System="yes" Permanent="no" />
      </Component>
    </DirectoryRef>
  </Fragment>
</Wix>"""]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

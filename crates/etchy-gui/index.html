<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>etchy — PCB diff viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f0e; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
    color: #8b93a3; font: 15px -apple-system, "Segoe UI", Roboto, sans-serif; }
  #loading b { color: #36d39a; }
</style>
</head>
<body>
  <div id="loading"><div><b>etchy</b> — loading…</div></div>
  <canvas id="the_canvas_id"></canvas>
  <!-- data-wasm-opt="0": trunk's bundled binaryen rejects Rust's bulk-memory /
       reference-types output and fails the release build (#99). We skip trunk's
       wasm-opt and run it ourselves (CI + deploy/setup.sh) with the feature flags
       enabled — see the "wasm-opt" step in .github/workflows/ci.yml. -->
  <link data-trunk rel="rust" data-wasm-opt="0" />
  <script>
    // Remove the loading splash when the app starts. (Don't gate on canvas.width —
    // a bare <canvas> defaults to width 300, so that check fires immediately.)
    addEventListener('TrunkApplicationStarted', () => {
      const l = document.getElementById('loading'); if (l) l.remove();
    });
  </script>
</body>
</html>

[package]
name = "etchy-pdf"
description = "etchy schematic-PDF pixel diff (feature-gated; pure-Rust hayro rasterizer)."
version.workspace = true
edition.workspace = true
# hayro needs a newer toolchain than the workspace MSRV; this crate is opt-in
# (the `pdf` feature) and never in the default binaries, so it carries its own MSRV.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Off by default: the pure-Rust PDF rasterizer (hayro) and its dep tree stay out
# of the default build, which keeps the core geometric-diff binary lean and its
# MSRV low. Turn on with `--features pdf`.
default = []
pdf = ["dep:hayro", "dep:png"]

[dependencies]
etchy-core = { path = "../etchy-core" }
# Pure-Rust PDF rasterizer (no C++/PDFium). Kept optional so the heavy PDF stack
# only compiles when the `pdf` feature is requested.
hayro = { version = "0.6", optional = true }
# PNG encode for the overlay images (already in hayro's tree via vello_common).
png = { version = "0.17", optional = true }

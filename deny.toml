# cargo-deny config — enforces etchy's "permissive only, no copyleft" rule.
# Run in CI by the `deny` job in .github/workflows/ci.yml (#84). Tune the
# allow-list as the verified stack (see DEVELOPER_GUIDE) grows.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "NCSA",
    # Permissive licenses present in the real dependency tree (all OSI/FSF
    # permissive — no copyleft): Boost, public-domain, and the fonts eframe ships.
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
# GPL / AGPL / LGPL / MPL are intentionally NOT allowed — etchy ships permissive
# only (the reason mupdf/Poppler-based PDF crates were rejected; see DEVELOPER_GUIDE).
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
version = 2
yanked = "deny"

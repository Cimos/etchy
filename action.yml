name: etchy PCB diff
description: >-
  Diff two revisions of a board's fab output and gate the pipeline on the result.
  Writes a Markdown summary to the job step-summary and (optionally) a sticky PR
  comment. Exit-code contract: 0 = no diff, 1 = diff, 2 = error. Any other
  code (a panic, an OOM kill, a missing binary) is treated as an error, never
  as "no change".
author: Cimos
branding:
  icon: layers
  color: orange

inputs:
  old:
    description: Directory of the OLD revision's Gerber/Excellon files.
    required: true
  new:
    description: Directory of the NEW revision's Gerber/Excellon files.
    required: true
  fail-on-diff:
    description: Fail the step when differences are found (exit 1). Set false to report only.
    required: false
    default: "true"
  comment:
    description: Post the layer-by-layer diff as a sticky PR comment. Only needs the consumer's job to grant pull-requests:write — the token is supplied automatically.
    required: false
    default: "false"

outputs:
  changed:
    description: "true if any layer changed, else false."
    value: ${{ steps.run.outputs.changed }}

runs:
  using: composite
  steps:
    # Build etchy from this repo (no release binary published yet). Cargo's own
    # cache + the toolchain are the consumer workflow's responsibility. Use the
    # runner-provided $GITHUB_ACTION_PATH env var, not a ${{ }} template, so no
    # value is expanded into the script.
    - shell: bash
      run: cargo build --release --quiet -p etchy-cli --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml"
    - id: run
      shell: bash
      # Inputs are passed via env (NOT ${{ }} into the script) so a crafted value
      # can't be expanded as shell — avoids GitHub Actions script injection.
      env:
        OLD_DIR: ${{ inputs.old }}
        NEW_DIR: ${{ inputs.new }}
        DO_COMMENT: ${{ inputs.comment }}
        FAIL_ON_DIFF: ${{ inputs.fail-on-diff }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # The workflow's own token, supplied by the action so the consumer wires
        # nothing but `permissions: pull-requests: write`. github.token is not
        # user-controlled, so it's safe to expand here.
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Reject dash-leading paths so a value can't be smuggled in as an etchy flag.
        case "$OLD_DIR" in -*) echo "invalid old dir: $OLD_DIR" >&2; exit 2;; esac
        case "$NEW_DIR" in -*) echo "invalid new dir: $NEW_DIR" >&2; exit 2;; esac
        etchy="${GITHUB_ACTION_PATH}/target/release/etchy"
        set +e
        md="$("$etchy" --format md -- "$OLD_DIR" "$NEW_DIR")"
        code=$?
        set -e
        case "$code" in 0|1) ;; *) echo "etchy exited $code" >&2; exit 2;; esac
        printf '%s\n' "$md" >> "$GITHUB_STEP_SUMMARY"
        echo "changed=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        # Post/refresh the sticky PR comment with the layer-by-layer table. A
        # comment failure (missing permission, not a PR event) is a warning, not
        # a pipeline failure — never let reporting break the gate.
        if [ "$DO_COMMENT" = "true" ] && [ -n "$PR_NUMBER" ]; then
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::comment:true but no token available — skipping PR comment"
          else
            printf '%s\n' "$md" | gh pr comment "$PR_NUMBER" --edit-last --body-file - \
              || printf '%s\n' "$md" | gh pr comment "$PR_NUMBER" --body-file - \
              || echo "::warning::could not post PR comment — grant the job pull-requests:write"
          fi
        fi
        [ "$FAIL_ON_DIFF" = "true" ] && [ "$code" -eq 1 ] && exit 1 || true
